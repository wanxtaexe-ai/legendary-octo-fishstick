name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout or initialize builds branch
        shell: bash
        run: |
          git clone --branch builds "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$GITHUB_WORKSPACE/builds" 2>/dev/null || {
            mkdir -p "$GITHUB_WORKSPACE/builds"
            cd "$GITHUB_WORKSPACE/builds"
            git init
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git checkout --orphan builds
          }

      - name: Clean old builds
        run: rm -f "$GITHUB_WORKSPACE/builds/"*.cs3 "$GITHUB_WORKSPACE/builds/plugins.json" "$GITHUB_WORKSPACE/builds/repo.json"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Build Plugins
        run: |
          cd "$GITHUB_WORKSPACE/src"
          chmod +x gradlew
          set -o pipefail
          set +e
          ./gradlew make makePluginsJson --no-daemon > "$GITHUB_WORKSPACE/gradle.log" 2>&1
          STATUS=$?
          set -e
          cat "$GITHUB_WORKSPACE/gradle.log"
          if [ "$STATUS" -ne 0 ]; then
            ERR_SUMMARY=$(grep -E "e: " "$GITHUB_WORKSPACE/gradle.log" | head -n 15 | tr '\n' ' ' || true)
            if [ -z "$ERR_SUMMARY" ]; then
              ERR_SUMMARY=$(tail -n 30 "$GITHUB_WORKSPACE/gradle.log" | tr '\n' ' ' || true)
            fi
            echo "::error::Gradle failed ($STATUS): $ERR_SUMMARY"
            exit "$STATUS"
          fi
          cp */build/*.cs3 "$GITHUB_WORKSPACE/builds/"
          cp build/plugins.json "$GITHUB_WORKSPACE/builds/"
          cp repo.json "$GITHUB_WORKSPACE/builds/"

      - name: Push builds
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit -m "Build $GITHUB_SHA" || exit 0
          git push --force origin builds
