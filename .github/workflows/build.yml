name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout or initialize builds branch
        shell: bash
        run: |
          git clone --branch builds "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$GITHUB_WORKSPACE/builds" 2>/dev/null || {
            mkdir -p "$GITHUB_WORKSPACE/builds"
            cd "$GITHUB_WORKSPACE/builds"
            git init
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git checkout --orphan builds
          }

      - name: Clean old builds
        run: rm -f "$GITHUB_WORKSPACE/builds/"*.cs3 "$GITHUB_WORKSPACE/builds/plugins.json" "$GITHUB_WORKSPACE/builds/repo.json"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Build Plugins
        run: |
          cd "$GITHUB_WORKSPACE/src"
          chmod +x gradlew
          set -o pipefail
          set +e
          ./gradlew make makePluginsJson --no-daemon > "$GITHUB_WORKSPACE/gradle.log" 2>&1
          STATUS=$?
          set -e
          cat "$GITHUB_WORKSPACE/gradle.log"
          if [ "$STATUS" -ne 0 ]; then
            ERR_SUMMARY=$(grep -E "e: " "$GITHUB_WORKSPACE/gradle.log" | head -n 15 | tr '\n' ' ' || true)
            if [ -z "$ERR_SUMMARY" ]; then
              ERR_SUMMARY=$(tail -n 30 "$GITHUB_WORKSPACE/gradle.log" | tr '\n' ' ' || true)
            fi
            echo "::error::Gradle failed ($STATUS): $ERR_SUMMARY"
            exit "$STATUS"
          fi
          cp */build/*.cs3 "$GITHUB_WORKSPACE/builds/"
          cp build/plugins.json "$GITHUB_WORKSPACE/builds/"
          cp repo.json "$GITHUB_WORKSPACE/builds/"

      - name: Push builds
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit -m "Build $GITHUB_SHA" || exit 0
          git push --force origin builds

  test-adchain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Test Yumeiro Ad-Chain Resolver
        run: |
          chmod +x gradlew
          set +e
          ./gradlew -p yumeiro-adchain test --no-daemon > adchain.log 2>&1
          STATUS=$?
          set -e
          cat adchain.log
          if [ "$STATUS" -ne 0 ]; then
            ERR_SUMMARY=$(grep -E "e: |FAILED|Assertion" adchain.log | head -n 15 | tr '\n' ' ' || true)
            if [ -z "$ERR_SUMMARY" ]; then
              ERR_SUMMARY=$(tail -n 30 adchain.log | tr '\n' ' ' || true)
            fi
            echo "::error::AdChain tests failed ($STATUS): $ERR_SUMMARY"
            exit "$STATUS"
          fi

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Build & Test AnimeVault APK
        run: |
          chmod +x gradlew
          set +e
          ./gradlew -p anime-downloader-app testDebugUnitTest assembleDebug --no-daemon > apk.log 2>&1
          STATUS=$?
          set -e
          cat apk.log
          if [ "$STATUS" -ne 0 ]; then
            ERR_SUMMARY=$(grep -n -E "^e: |^\* What went wrong:|FAILURE:|ERROR:|Exception|AssertionError" apk.log | head -n 25 | tr '\n' ' ' || true)
            if [ -z "$ERR_SUMMARY" ]; then
              ERR_SUMMARY=$(tail -n 35 apk.log | tr '\n' ' ' || true)
            fi
            echo "::error::APK build failed ($STATUS): $ERR_SUMMARY"
            exit "$STATUS"
          fi
          cp anime-downloader-app/app/build/outputs/apk/debug/app-debug.apk AnimeVault-debug.apk

      - name: Upload AnimeVault APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeVault-debug-apk
          path: AnimeVault-debug.apk

  publish-apk:
    needs: [build, build-apk]
    if: always() && needs.build-apk.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: AnimeVault-debug-apk

      - name: Push APK to builds branch
        shell: bash
        run: |
          git clone --branch builds "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$GITHUB_WORKSPACE/builds" 2>/dev/null || {
            mkdir -p "$GITHUB_WORKSPACE/builds"
            cd "$GITHUB_WORKSPACE/builds"
            git init
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git checkout --orphan builds
          }
          cp AnimeVault-debug.apk "$GITHUB_WORKSPACE/builds/AnimeVault-debug.apk"
          cd "$GITHUB_WORKSPACE/builds"
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add AnimeVault-debug.apk
          git commit -m "Publish AnimeVault APK $GITHUB_SHA" || exit 0
          git push origin builds
